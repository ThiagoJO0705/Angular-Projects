<div class="container">
    <div class="form-box">
        <form #frm="ngForm" (ngSubmit)="calcularResultado()" >
            <h2>Calculadora</h2>
            <label for="number1">Número 1</label>
            <input type="number" name="number1" id="number1" [(ngModel)]="number1" />

            <label for="numero2">Número 2</label>
            <input type="number" name="number2" id="number2" [(ngModel)]="number2" />

            <button type="submit">Somar</button>
        </form>

        <div class="result-display" *ngIf="result">
            <p>Seu resultado está abaixo:</p>
        </div>

        @if(result){
            <div class="result-display">
                <p>Resultado: <span id="result"> {{ result }} </span></p>
            </div>            
        } @else {
            <div class="result-display">
                <p>Seu resultado aparecerá aqui.</p>
            </div>
        }

    </div>
</div>
